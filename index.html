<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhagavad Gita – Chapter 1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #fffaf0;
        color: #1f1f1f;
      }
      header {
        background: #7a3e00;
        color: white;
        padding: 16px;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      .note {
        background: #fff3db;
        border: 1px solid #f2d5a5;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .verse {
        background: white;
        border: 1px solid #e6d7c2;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0 0 8px 0;
        color: #7a3e00;
        font-size: 18px;
      }
      .sanskrit {
        font-size: 20px;
        line-height: 1.7;
      }
      .transliteration,
      .translation {
        margin-top: 8px;
        line-height: 1.6;
      }
      .label {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bhagavad Gita – Chapter 1</h1>
      <p>The Yoga of Arjuna's Dejection</p>
    </header>

    <main>
      <div class="note">
        A simple static app showing Chapter 1 verses with Sanskrit text,
        transliteration, and English translation.
      </div>

      <div id="verses"></div>
    </main>

    <script>
      const verses = [
        {
          number: 1,
          sanskrit:
            "धृतराष्ट्र उवाच । धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः । मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥ १.१ ॥",
          transliteration:
            "dhṛtarāṣṭra uvāca | dharma-kṣetre kuru-kṣetre samavetā yuyutsavaḥ | māmakāḥ pāṇḍavāś caiva kim akurvata sañjaya || 1.1 ||",
          translation:
            "Dhritarashtra said: O Sanjaya, assembled at Kurukshetra, eager for battle, what did my sons and the sons of Pandu do?"
        },
        {
          number: 2,
          sanskrit:
            "सञ्जय उवाच । दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा । आचार्यमुपसङ्गम्य राजा वचनमब्रवीत् ॥ १.२ ॥",
          transliteration:
            "sañjaya uvāca | dṛṣṭvā tu pāṇḍavānīkaṁ vyūḍhaṁ duryodhanas tadā | ācāryam upasaṅgamya rājā vacanam abravīt || 1.2 ||",
          translation:
            "Sanjaya said: Seeing the army of the Pandavas arranged for battle, King Duryodhana approached his teacher and spoke these words."
        },
        {
          number: 3,
          sanskrit:
            "पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् । व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ॥ १.३ ॥",
          transliteration:
            "paśyaitāṁ pāṇḍu-putrāṇām ācārya mahatīṁ camūm | vyūḍhāṁ drupada-putreṇa tava śiṣyeṇa dhīmatā || 1.3 ||",
          translation:
            "Behold, O teacher, this mighty army of the sons of Pandu, arranged by your wise disciple, the son of Drupada."
        },
        {
          number: 4,
          sanskrit:
            "अत्र शूरा महेष्वासा भीमार्जुनसमा युधि । युयुधानो विराटश्च द्रुपदश्च महारथः ॥ १.४ ॥",
          transliteration:
            "atra śūrā maheṣv-āsā bhīmārjuna-samā yudhi | yuyudhāno virāṭaś ca drupadaś ca mahārathaḥ || 1.4 ||",
          translation:
            "Here are heroic bowmen equal in battle to Bhima and Arjuna: Yuyudhana, Virata, and the great chariot-warrior Drupada."
        },
        {
          number: 5,
          sanskrit:
            "धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान् । पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुङ्गवः ॥ १.५ ॥",
          transliteration:
            "dhṛṣṭaketuś cekitānaḥ kāśirājaś ca vīryavān | purujit kuntibhojaś ca śaibyaś ca nara-puṅgavaḥ || 1.5 ||",
          translation:
            "There are also Dhrishtaketu, Cekitana, the valiant king of Kashi, Purujit, Kuntibhoja, and Shaibya, best among men."
        }
      ];

      const verseContainer = document.getElementById("verses");

      verses.forEach((v) => {
        const card = document.createElement("section");
        card.className = "verse";
        card.innerHTML = `
          <h2>Verse ${v.number}</h2>
          <div class="sanskrit">${v.sanskrit}</div>
          <div class="transliteration"><span class="label">Transliteration:</span> ${v.transliteration}</div>
          <div class="translation"><span class="label">Translation:</span> ${v.translation}</div>
        `;
        verseContainer.appendChild(card);
      });
    </script>
  </body>
</html>
